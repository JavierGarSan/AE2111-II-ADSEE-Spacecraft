<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 1260 1782" role="img" aria-labelledby="title description">
  <title id="title">Spacecraft dashboard calculation flow</title>
  <desc id="description">Two left-to-right halves. The upper half begins with Dashboard Input and ends with signal-to-noise calculations. Its connector goes down, left, and down into Modulation in the lower half. All planet, modulation, and encoding branches rejoin their shared calculations.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#333"/></marker></defs>
  <rect x="0" y="0" width="1260" height="1782" fill="white"/>
  <g id="connections" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)">
    <polyline points="159,350 181,350"/>
    <polyline points="309,350 331,350"/>
    <polyline points="459,350 470,350 470,130 481,130"/>
    <polyline points="459,350 470,350 470,240 481,240"/>
    <polyline points="459,350 481,350"/>
    <polyline points="459,350 470,350 470,460 481,460"/>
    <polyline points="609,130 770,130 770,350 781,350"/>
    <polyline points="609,240 770,240 770,350 781,350"/>
    <polyline points="609,350 631,350"/>
    <polyline points="609,460 620,460 620,350 631,350"/>
    <polyline points="759,350 781,350"/>
    <polyline points="909,350 931,350"/>
    <polyline points="1059,350 1081,350"/>
    <polyline id="row-return" points="1145,416 1145,670 95,670 95,800"/>
    <polyline points="159,850 170,850 170,750 181,750"/>
    <polyline points="159,850 170,850 170,950 181,950"/>
    <polyline points="309,750 320,750 320,850 331,850"/>
    <polyline points="309,950 320,950 320,850 331,850"/>
    <polyline points="459,850 470,850 470,750 481,750"/>
    <polyline points="459,850 470,850 470,950 481,950"/>
    <polyline points="609,750 620,750 620,850 631,850"/>
    <polyline points="609,950 620,950 620,850 631,850"/>
    <polyline points="759,850 781,850"/>
    <polyline points="909,850 931,850"/>
  </g>
  <g id="blocks" fill="white" stroke="#333" stroke-width="2">
    <rect id="INPUT" x="31" y="316" width="128" height="68"/>
    <rect id="CHECK" x="181" y="316" width="128" height="68"/>
    <polygon id="BODY" points="395,300 459,350 395,400 331,350"/>
    <rect id="EARTH" x="481" y="86" width="128" height="88"/>
    <rect id="MOON" x="481" y="196" width="128" height="88"/>
    <rect id="MARS" x="481" y="321" width="128" height="58"/>
    <rect id="MERCURY" x="481" y="431" width="128" height="58"/>
    <rect id="PLANET" x="631" y="306" width="128" height="88"/>
    <rect id="IMAGING" x="781" y="306" width="128" height="88"/>
    <rect id="RATE" x="931" y="273" width="128" height="154"/>
    <rect id="SIGNAL" x="1081" y="284" width="128" height="132"/>
    <polygon id="MOD" points="95,800 159,850 95,900 31,850"/>
    <rect id="QAM4" x="181" y="695" width="128" height="110"/>
    <rect id="QAM64" x="181" y="895" width="128" height="110"/>
    <polygon id="ENCODING" points="395,800 459,850 395,900 331,850"/>
    <rect id="UNCODED" x="481" y="695" width="128" height="110"/>
    <rect id="LDPC" x="481" y="895" width="128" height="110"/>
    <rect id="MARGINS" x="631" y="816" width="128" height="68"/>
    <rect id="BANDWIDTH" x="781" y="795" width="128" height="110"/>
    <rect id="RESULTS" x="931" y="816" width="128" height="68"/>
  </g>
  <g id="labels" font-family="Arial, sans-serif" font-size="17" fill="#111" text-anchor="middle">
    <text><tspan x="95" y="346">Dashboard</tspan><tspan x="95" y="368">Input</tspan></text>
    <text><tspan x="245" y="346">Check</tspan><tspan x="245" y="368">inputs</tspan></text>
    <text><tspan x="395" y="346">Orbiting</tspan><tspan x="395" y="368">body?</tspan></text>
    <text><tspan x="545" y="115">Calculate</tspan><tspan x="545" y="137">Earth-orbit</tspan><tspan x="545" y="159">range</tspan></text>
    <text><tspan x="545" y="225">Calculate</tspan><tspan x="545" y="247">Earth–Moon</tspan><tspan x="545" y="269">range</tspan></text>
    <text><tspan x="545" y="357">Mars orbit</tspan></text>
    <text><tspan x="545" y="467">Mercury orbit</tspan></text>
    <text><tspan x="695" y="335">Calculate</tspan><tspan x="695" y="357">Earth–planet</tspan><tspan x="695" y="379">range</tspan></text>
    <text><tspan x="845" y="335">Calculate data</tspan><tspan x="845" y="357">generated by</tspan><tspan x="845" y="379">imaging</tspan></text>
    <text><tspan x="995" y="302">Determine</tspan><tspan x="995" y="324">required</tspan><tspan x="995" y="346">downlink data</tspan><tspan x="995" y="368">rate through</tspan><tspan x="995" y="390">BER</tspan><tspan x="995" y="412">calculation</tspan></text>
    <text><tspan x="1145" y="313">Calculate</tspan><tspan x="1145" y="335">uplink and</tspan><tspan x="1145" y="357">downlink</tspan><tspan x="1145" y="379">signal to noise</tspan><tspan x="1145" y="401">ratio</tspan></text>
    <text><tspan x="95" y="857">Modulation?</tspan></text>
    <text><tspan x="245" y="724">Determine</tspan><tspan x="245" y="746">4-QAM</tspan><tspan x="245" y="768">requirements</tspan><tspan x="245" y="790">and apply gain</tspan></text>
    <text><tspan x="245" y="924">Determine</tspan><tspan x="245" y="946">64-QAM</tspan><tspan x="245" y="968">requirements</tspan><tspan x="245" y="990">and apply gain</tspan></text>
    <text><tspan x="395" y="857">Encoding?</tspan></text>
    <text><tspan x="545" y="735">Determine</tspan><tspan x="545" y="757">uncoded link</tspan><tspan x="545" y="779">requirements</tspan></text>
    <text><tspan x="545" y="924">Determine</tspan><tspan x="545" y="946">LDPC link</tspan><tspan x="545" y="968">requirements</tspan><tspan x="545" y="990">and apply gain</tspan></text>
    <text><tspan x="695" y="846">Calculate</tspan><tspan x="695" y="868">link margins</tspan></text>
    <text><tspan x="845" y="824">Determine</tspan><tspan x="845" y="846">transmitted</tspan><tspan x="845" y="868">data rates and</tspan><tspan x="845" y="890">bandwidth</tspan></text>
    <text><tspan x="995" y="846">Dashboard</tspan><tspan x="995" y="868">Results</tspan></text>
  </g>
</svg>
